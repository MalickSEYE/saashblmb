version: '3.9'

services:

  # ── Base de données ────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: mouride-db
    environment:
      POSTGRES_DB:       mouride
      POSTGRES_USER:     mouride
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mouride_secret_2024}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [mouride-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mouride"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: mouride-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_mouride}
    volumes:
      - redis_data:/data
    networks: [mouride-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  # ── RabbitMQ ──────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: mouride-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: mouride
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbit_mouride}
    volumes:
      - rabbit_data:/var/lib/rabbitmq
    ports:
      - "15672:15672"   # Management UI
    networks: [mouride-net]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      retries: 5

  # ── MinIO ─────────────────────────────────────────────────
  minio:
    image: minio/minio
    container_name: mouride-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ACCESS_KEY:-minio_mouride}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minio_secret_2024}
    volumes:
      - minio_data:/data
    ports:
      - "9001:9001"   # Console MinIO
    networks: [mouride-net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 5

  # ── Backend Spring Boot ───────────────────────────────────
  backend:
    build: ./backend
    container_name: mouride-backend
    ports:
      - "8080:8080"
    environment:
      DB_URL:              jdbc:postgresql://db:5432/mouride
      DB_USER:             mouride
      DB_PASSWORD:         ${DB_PASSWORD:-mouride_secret_2024}
      REDIS_HOST:          redis
      REDIS_PASSWORD:      ${REDIS_PASSWORD:-redis_mouride}
      RABBITMQ_HOST:       rabbitmq
      RABBITMQ_USER:       mouride
      RABBITMQ_PASS:       ${RABBITMQ_PASSWORD:-rabbit_mouride}
      MINIO_ENDPOINT:      http://minio:9000
      MINIO_ACCESS_KEY:    ${MINIO_ACCESS_KEY:-minio_mouride}
      MINIO_SECRET_KEY:    ${MINIO_SECRET_KEY:-minio_secret_2024}
      JWT_SECRET:          ${JWT_SECRET:-mouride-jwt-secret-min-256-bits-change-in-production}
      SMTP_HOST:           ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT:           ${SMTP_PORT:-587}
      SMTP_USER:           ${SMTP_USER:-}
      SMTP_PASSWORD:       ${SMTP_PASSWORD:-}
    depends_on:
      db:       { condition: service_healthy }
      redis:    { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [mouride-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # ── Frontend Angular ──────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: mouride-frontend
    ports:
      - "4200:80"
    depends_on:
      backend: { condition: service_healthy }
    networks: [mouride-net]

networks:
  mouride-net:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  rabbit_data:
  minio_data:
