# render.yaml — Mouride SaaS Platform
# Déposer ce fichier à la RACINE du dépôt GitHub

services:

  # ── Backend Spring Boot ───────────────────────────────────
  - type: web
    name: mouride-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: frankfurt
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: mouride-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: mouride-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: mouride-db
          property: password
      - key: REDIS_HOST
        fromService:
          name: mouride-redis
          type: redis
          property: host
      - key: REDIS_PORT
        fromService:
          name: mouride-redis
          type: redis
          property: port
      # REDIS_PASSWORD : à renseigner manuellement dans le dashboard Render
      # (Render ne permet pas d'exposer le password Redis via fromService)
      - key: JWT_SECRET
        generateValue: true
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: JAVA_OPTS
        value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Xss256k"
      - key: RABBITMQ_HOST
        value: ""

  # ── Redis ─────────────────────────────────────────────────
  - type: redis
    name: mouride-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []            # [] = accès uniquement depuis les services Render (recommandé)

databases:

  # ── PostgreSQL ────────────────────────────────────────────
  - name: mouride-db
    plan: free
    region: frankfurt
    postgresMajorVersion: 15
    databaseName: mouride
    user: mouride
