# render.yaml — Mouride SaaS Platform (v3 — corrigé)

services:

  - type: web
    name: mouride-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: frankfurt
    healthCheckPath: /actuator/health
    envVars:
      # Render fournit DATABASE_URL au format postgres://user:pass@host/db
      # Spring Boot a besoin du format jdbc:postgresql://...
      # On utilise une variable intermédiaire et on la transforme dans le Dockerfile
      - key: DATABASE_URL
        fromDatabase:
          name: mouride-db
          property: connectionString
      - key: DB_USER
        fromDatabase:
          name: mouride-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: mouride-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: mouride-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: mouride-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: mouride-db
          property: database
      - key: REDIS_HOST
        fromService:
          name: mouride-redis
          type: redis
          property: host
      - key: REDIS_PORT
        fromService:
          name: mouride-redis
          type: redis
          property: port
      - key: JWT_SECRET
        generateValue: true
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: JAVA_OPTS
        value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=70.0 -Xss256k -Djava.security.egd=file:/dev/./urandom"

  - type: redis
    name: mouride-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: mouride-db
    plan: free
    region: frankfurt
    postgresMajorVersion: 15
    databaseName: mouride
    user: mouride
