# render.yaml — Mouride SaaS Platform

services:

  - type: web
    name: mouride-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: frankfurt
    healthCheckPath: /actuator/health
    envVars:
      # Variables séparées pour la DB (plus fiables que DATABASE_URL)
      - key: DB_HOST
        fromDatabase:
          name: mouride-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: mouride-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: mouride-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: mouride-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: mouride-db
          property: password
      # Aussi DATABASE_URL en fallback
      - key: DATABASE_URL
        fromDatabase:
          name: mouride-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: JAVA_OPTS
        value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=70.0"

  - type: redis
    name: mouride-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: mouride-db
    plan: free
    region: frankfurt
    postgresMajorVersion: 15
    databaseName: mouride
    user: mouride
