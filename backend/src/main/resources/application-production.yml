# backend/src/main/resources/application-production.yml
# Profil Spring activé sur Render (SPRING_PROFILES_ACTIVE=production)

spring:
  datasource:
    # Render injecte SPRING_DATASOURCE_URL directement (format jdbc:postgresql://...)
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME:mouride}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    validate-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Le mot de passe Redis doit être ajouté manuellement dans le dashboard Render
      # Settings → Environment → Add REDIS_PASSWORD
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms

server:
  port: ${PORT:8080}
  forward-headers-strategy: native
  tomcat:
    max-threads: 20

logging:
  level:
    root: WARN
    com.mouride: INFO
    org.flywaydb: INFO

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true
