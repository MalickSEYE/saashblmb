# backend/src/main/resources/application-production.yml
# Profil Spring activé sur Render.com (SPRING_PROFILES_ACTIVE=production)

spring:
  datasource:
    # Render injecte une URL complète de type :
    # postgresql://user:password@host:5432/dbname
    # Spring la convertit automatiquement si on utilise DATABASE_URL
    url: ${DB_URL}
    username: ${DB_USER:mouride}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5        # Limité sur le plan gratuit Render
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway gère les migrations, pas Hibernate
    show-sql: false
  flyway:
    enabled: true
    validate-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: false
      timeout: 3000ms

server:
  port: ${PORT:8080}             # Render injecte la variable PORT automatiquement
  forward-headers-strategy: native
  tomcat:
    max-threads: 20              # Limité pour optimiser la RAM

# Logging réduit en production
logging:
  level:
    root: WARN
    com.mouride: INFO
    org.flywaydb: INFO

# Swagger désactivé en production (optionnel)
springdoc:
  swagger-ui:
    enabled: true               # Mettre false pour masquer la doc en prod
  api-docs:
    enabled: true
