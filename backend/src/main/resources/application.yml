spring:
  application:
    name: mouride-platform
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/mouride}
    username: ${SPRING_DATASOURCE_USERNAME:mouride}
    password: ${SPRING_DATASOURCE_PASSWORD:mouride}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: ${PORT:8080}
  compression:
    enabled: true

mouride:
  jwt:
    secret: ${JWT_SECRET:mouride-secret-key-change-in-production-min-256-bits}
    expiration: 3600000
    refresh-expiration: 604800000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.mouride: INFO
    org.springframework.security: WARN
